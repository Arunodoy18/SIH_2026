[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redzone"
version = "0.1.0"
description = "Hazard red zones, carrying capacity and relocation priority for a DDMA (SIH 2026, Sikkim)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pulp>=2.7",
    "anthropic>=0.25",
    "groq>=0.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["redzone*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
